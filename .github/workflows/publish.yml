name: Publish

on: workflow_dispatch

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          echo $ERR_LOG_KEY > log_creds.txt
          echo $ERR_LOG_SECRET >> log_creds.txt
          echo $ERR_LOG_URL >> log_creds.txt
          echo $TELEMETRY_URL >> log_creds.txt

      - name: Clean existing macOS (x64) assets from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Checking release $TAG for existing macOS-x64 assets..."
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | test("mac-x64";"i")) | .name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while IFS= read -r asset; do
              echo "Deleting existing asset: $asset"
              gh release delete-asset "$TAG" "$asset" --confirm 2>/dev/null || true
            done
          fi

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn build --mac --publish always

      - name: Tar files
        run: tar -cvf dist-macOS.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-macOS
          path: dist-macOS.tar

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          echo $ERR_LOG_KEY > log_creds.txt
          echo $ERR_LOG_SECRET >> log_creds.txt
          echo $ERR_LOG_URL >> log_creds.txt
          echo $TELEMETRY_URL >> log_creds.txt

      - name: Clean existing macOS (arm64) assets from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Checking release $TAG for existing macOS-arm64 assets..."
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | test("mac-arm64";"i")) | .name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while IFS= read -r asset; do
              echo "Deleting existing asset: $asset"
              gh release delete-asset "$TAG" "$asset" --confirm 2>/dev/null || true
            done
          fi

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn build --mac --publish always

      - name: Tar files
        run: tar -cvf dist-macOS-arm.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-macOS-arm
          path: dist-macOS-arm.tar

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          
      - name: Enable Corepack
        run: corepack enable
        
      - name: Install dependencies
        run: yarn install

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          echo $ERR_LOG_KEY > log_creds.txt
          echo $ERR_LOG_SECRET >> log_creds.txt
          echo $ERR_LOG_URL >> log_creds.txt
          echo $TELEMETRY_URL >> log_creds.txt

      - name: Run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn build --linux --publish always

      - name: Tar files
        run: tar -cvf dist-linux.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist-linux.tar

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          echo $ERR_LOG_KEY > log_creds.txt
          echo $ERR_LOG_SECRET >> log_creds.txt
          echo $ERR_LOG_URL >> log_creds.txt
          echo $TELEMETRY_URL >> log_creds.txt

      - name: Clean existing Windows assets from GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Checking release $TAG for existing Windows assets..."
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | test("windows-(x64|ia32)";"i")) | .name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while IFS= read -r asset; do
              echo "Deleting existing asset: $asset"
              gh release delete-asset "$TAG" "$asset" --confirm 2>/dev/null || true
            done
          fi

      - name: Run build (no publish; upload handled separately)
        uses: nick-fields/retry@v4
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_seconds: 1200
          retry_on: any
          shell: bash
          command: |
            yarn build --win --publish never

      - name: Upload installers to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          # electron-builder's in-process GitHub publisher flakes on Windows
          # ("Request timed out" during cleanup) even when every asset was
          # uploaded successfully. Uploading via gh CLI is resumable and
          # idempotent (--clobber).
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            dist_electron/bundled/*windows*.exe \
            dist_electron/bundled/*windows*.exe.blockmap \
            --clobber

      - name: Tar files
        run: tar -cvf dist-windows.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist-windows.tar
