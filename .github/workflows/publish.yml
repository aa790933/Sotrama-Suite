name: Publish

on: workflow_dispatch

jobs:
  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          printf '%s\n' "$ERR_LOG_KEY" "$ERR_LOG_SECRET" "$ERR_LOG_URL" "$TELEMETRY_URL" > log_creds.txt

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn build --mac --publish never

      - name: Tar files
        run: tar -cvf dist-macOS.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-macOS
          path: dist-macOS.tar

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          printf '%s\n' "$ERR_LOG_KEY" "$ERR_LOG_SECRET" "$ERR_LOG_URL" "$TELEMETRY_URL" > log_creds.txt

      - name: Run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: yarn build --mac --publish never

      - name: Tar files
        run: tar -cvf dist-macOS-arm.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-macOS-arm
          path: dist-macOS-arm.tar

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"


      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          printf '%s\n' "$ERR_LOG_KEY" "$ERR_LOG_SECRET" "$ERR_LOG_URL" "$TELEMETRY_URL" > log_creds.txt

      - name: Run build
        run: yarn build --linux --publish never

      - name: Tar files
        run: tar -cvf dist-linux.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-linux
          path: dist-linux.tar

  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set Error Log Creds
        env:
          ERR_LOG_KEY: ${{ secrets.ERR_LOG_KEY }}
          ERR_LOG_URL: ${{ secrets.ERR_LOG_URL }}
          ERR_LOG_SECRET: ${{ secrets.ERR_LOG_SECRET }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
        run: |
          printf '%s\n' "$ERR_LOG_KEY" "$ERR_LOG_SECRET" "$ERR_LOG_URL" "$TELEMETRY_URL" > log_creds.txt

      - name: Run build (no publish; upload handled separately)
        uses: nick-fields/retry@v4
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        with:
          max_attempts: 3
          retry_wait_seconds: 60
          timeout_seconds: 1200
          retry_on: any
          shell: bash
          command: |
            yarn build --win --publish never

      - name: Tar files
        run: tar -cvf dist-windows.tar dist_electron

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-windows
          path: dist-windows.tar

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-macos-arm, build-linux, build-windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-macOS
          path: artifacts/mac-x64

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-macOS-arm
          path: artifacts/mac-arm64

      - name: Download Linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-linux
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist-windows
          path: artifacts/windows

      - name: Extract build artifacts
        run: |
          tar -xf artifacts/mac-x64/dist-macOS.tar -C artifacts/mac-x64
          tar -xf artifacts/mac-arm64/dist-macOS-arm.tar -C artifacts/mac-arm64
          tar -xf artifacts/linux/dist-linux.tar -C artifacts/linux
          tar -xf artifacts/windows/dist-windows.tar -C artifacts/windows

      - name: Merge macOS update metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const YAML = require('yaml');
          const x64Path = 'artifacts/mac-x64/dist_electron/bundled/latest-mac.yml';
          const armPath = 'artifacts/mac-arm64/dist_electron/bundled/latest-mac.yml';
          const x64 = YAML.parse(fs.readFileSync(x64Path, 'utf8'));
          const arm = YAML.parse(fs.readFileSync(armPath, 'utf8'));
          const files = [...(x64.files ?? []), ...(arm.files ?? [])];
          x64.files = [...new Map(files.map((file) => [file.url, file])).values()];
          fs.mkdirSync('release-assets', { recursive: true });
          fs.writeFileSync('release-assets/latest-mac.yml', YAML.stringify(x64));
          fs.copyFileSync(
            'artifacts/linux/dist_electron/bundled/latest-linux.yml',
            'release-assets/latest-linux.yml'
          );
          fs.copyFileSync(
            'artifacts/windows/dist_electron/bundled/latest.yml',
            'release-assets/latest.yml'
          );
          NODE

      - name: Upload all installers and update metadata
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            artifacts/mac-x64/dist_electron/bundled/*mac-x64* \
            artifacts/mac-arm64/dist_electron/bundled/*mac-arm64* \
            artifacts/linux/dist_electron/bundled/*linux* \
            artifacts/windows/dist_electron/bundled/*windows*.exe \
            artifacts/windows/dist_electron/bundled/*windows*.exe.blockmap \
            release-assets/latest-mac.yml \
            release-assets/latest-linux.yml \
            release-assets/latest.yml \
            --clobber
