name: Documentation

on:
  push:
    branches: [dev, main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/check-doc-links.ts'
      - 'build/icon.png'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'yarn.lock'
      - 'scripts/check-doc-links.ts'
      - 'build/icon.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Enable Corepack and prepare Yarn 4.7.0
        run: |
          corepack enable
          corepack prepare yarn@4.7.0 --activate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: yarn install --immutable

      - name: Copy icon to VitePress public folder
        run: |
          mkdir -p docs/public
          cp build/icon.png docs/public/icon.png

      - name: Check documentation links and public assets
        run: node --experimental-strip-types scripts/check-doc-links.ts

      - name: Build documentation
        run: yarn docs:build

      - name: Verify generated public assets
        shell: bash
        run: |
          test -s docs/.vitepress/dist/icon.png
          test -s docs/.vitepress/dist/favicon.svg
          test -s docs/.vitepress/dist/sotrama-suite-logo.svg
          test -s docs/.vitepress/dist/social-card.png
          node --experimental-strip-types scripts/check-doc-links.ts --built

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
