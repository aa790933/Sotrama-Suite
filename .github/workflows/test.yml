name: Test

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    # Job-level so every spawned process (tape, ts-node, workers) inherits them
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3307

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: sotra
          MARIADB_PASSWORD: password
        ports:
          # Host 3306 may already be taken by preinstalled MySQL on the image;
          # use 3307 so the service is unambiguous.
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'


      - name: Install dependencies
        run: yarn install

      - name: Provision MariaDB privileges and databases
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'sotra'@'%'; \
             CREATE USER IF NOT EXISTS 'sotrama_app'@'%' IDENTIFIED BY 'password'; \
             GRANT ALL PRIVILEGES ON *.* TO 'sotrama_app'@'%'; \
             CREATE DATABASE IF NOT EXISTS test_books_core; \
             FLUSH PRIVILEGES;"

      - name: Verify database connectivity
        run: |
          node -e "const m=require('mariadb');(async()=>{const c=await m.createConnection({host:'127.0.0.1',port:3307,user:'sotra',password:'password'});await c.query('SELECT 1');console.log('MariaDB reachable on 127.0.0.1:3307');await c.end();})().catch(e=>{console.error(e);process.exit(1);})"

      - name: Run tests
        run: yarn test

  uitest:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: sotra
          MARIADB_PASSWORD: password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install

      - name: Provision MariaDB database and grants
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'sotra'@'%'; FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS sotrama_uitest;"

      - name: Build source files (no sign, no package)
        run: yarn build --nosign --nopackage

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run --auto-servernum yarn uitest
