name: Test

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Pin Yarn Classic
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  uitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Pin Yarn Classic
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build source files (no sign, no package)
        run: yarn build --nosign --nopackage

      - name: Run UI tests
        run: yarn uitest
