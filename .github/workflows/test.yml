name: Test

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: sotra
          MARIADB_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js LTS (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Pin Yarn Classic
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install dependencies
        run: yarn install

      - name: Provision MariaDB privileges
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'sotra'@'%'; FLUSH PRIVILEGES;"

      - name: Run tests
        env:
          TEST_DB_HOST: 127.0.0.1
        run: yarn test

  uitest:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: sotra
          MARIADB_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js LTS (22.x)
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Pin Yarn Classic
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install dependencies
        run: yarn install

      - name: Provision MariaDB database and grants
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot -e \
            "GRANT ALL PRIVILEGES ON *.* TO 'sotra'@'%'; FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS sotrama_uitest;"

      - name: Build source files (no sign, no package)
        run: yarn build --nosign --nopackage

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run UI tests
        run: xvfb-run --auto-servernum yarn uitest
