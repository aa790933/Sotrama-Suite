name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Pin Yarn Classic
        run: |
          corepack enable
          yarn set version 1.22.22

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build (electron-builder --publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn build --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-electron-${{ runner.os }}-${{ github.sha }}
          path: |
            dist_electron/bundled
            dist_electron/build
          if-no-files-found: warn
          retention-days: 7
