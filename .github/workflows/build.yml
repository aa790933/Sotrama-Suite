name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce HTTPS for Git
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js LTS (24.x)
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build (electron-builder --publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: yarn build --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-electron-${{ runner.os }}-${{ github.sha }}
          path: |
            dist_electron/bundled
            dist_electron/build
          if-no-files-found: warn
          retention-days: 7
