name: rust-backend

permissions:
  contents: read

concurrency:
  group: rust-backend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, dev]
    paths:
      - 'rust-backend/**'
      - 'main/**'
      - 'tests/appProtocol.spec.ts'
      - 'build/scripts/build.mjs'
      - 'scripts/verify-rust-utility-bridge.mjs'
      - 'scripts/verify-rust-api-client.mjs'
      - 'scripts/verify-main-external-url.mjs'
      - 'scripts/verify-print-document-policy.mjs'
      - 'schemas/**'
      - 'backend/patches/**'
      - 'backend/database/core.ts'
      - 'backend/database/tests/testCore.spec.ts'
      - 'backend/database/runPatch.ts'
      - 'backend/database/types.ts'
      - 'backend/helpers.ts'
      - 'fyo/core/converter.ts'
      - 'fyo/database/Database.ts'
      - 'fyo/core/dbHandler.ts'
      - 'fyo/utils/translation.ts'
      - 'src/utils/misc.ts'
      - 'utils/translationHelpers.mjs'
      - 'utils/translationHelpers.cjs'
      - 'utils/index.ts'
      - 'utils/db/types.ts'
      - 'scripts/verify-rust-backend-boundaries.mjs'
      - 'utils/version.ts'
      - 'scripts/verify-rust-backend-package.mjs'
      - 'scripts/verify-rust-backend-client-runtime.mjs'
      - 'scripts/verify-rust-patch-parity.mjs'
      - 'scripts/test.sh'
      - 'scripts/verify-csv-parser.mjs'
      - 'utils/csvParser.js'
      - 'scripts/generateTranslations.js'
      - 'scripts/verify-translation-generator.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/rust-backend.yml'
  pull_request:
    paths:
      - 'rust-backend/**'
      - 'main/**'
      - 'tests/appProtocol.spec.ts'
      - 'build/scripts/build.mjs'
      - 'scripts/verify-rust-utility-bridge.mjs'
      - 'scripts/verify-rust-api-client.mjs'
      - 'scripts/verify-main-external-url.mjs'
      - 'scripts/verify-print-document-policy.mjs'
      - 'schemas/**'
      - 'backend/patches/**'
      - 'backend/database/core.ts'
      - 'backend/database/tests/testCore.spec.ts'
      - 'backend/database/runPatch.ts'
      - 'backend/database/types.ts'
      - 'backend/helpers.ts'
      - 'fyo/core/converter.ts'
      - 'fyo/database/Database.ts'
      - 'fyo/core/dbHandler.ts'
      - 'fyo/utils/translation.ts'
      - 'src/utils/misc.ts'
      - 'utils/translationHelpers.mjs'
      - 'utils/translationHelpers.cjs'
      - 'utils/index.ts'
      - 'utils/db/types.ts'
      - 'scripts/verify-rust-backend-boundaries.mjs'
      - 'utils/version.ts'
      - 'scripts/verify-rust-backend-package.mjs'
      - 'scripts/verify-rust-backend-client-runtime.mjs'
      - 'scripts/verify-rust-patch-parity.mjs'
      - 'scripts/test.sh'
      - 'scripts/verify-csv-parser.mjs'
      - 'utils/csvParser.js'
      - 'scripts/generateTranslations.js'
      - 'scripts/verify-translation-generator.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/rust-backend.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Debug builds of dependencies are several times larger and slower to link.
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  # Fast feedback: formatting, lints and the unit tests, which need no database.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev mariadb-client

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Verify Rust patch registry matches legacy registry
        run: node scripts/verify-rust-patch-parity.mjs

      - name: Verify backend-independent database contract
        run: node scripts/verify-rust-backend-boundaries.mjs

      - name: Verify Electron-to-Rust utility bridge
        run: node scripts/verify-rust-utility-bridge.mjs

      - name: Verify Rust ERPNext API client contract
        run: node scripts/verify-rust-api-client.mjs

      - name: Format, lint, and unit test
        run: |
          cd rust-backend
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The unit tests prove the SQL and DDL generators are correct. These prove the
  # generated SQL actually runs, which is the part a pure test cannot cover.
  integration:
    name: integration (mariadb ${{ matrix.mariadb-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the supported MariaDB lines before making Rust the default
        # database engine; SQL behavior and DDL metadata vary across releases.
        mariadb-version: ['10.6', '10.11', '11.4']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3307'
      TEST_DB_USER: sotrama
      TEST_DB_PASSWORD: password
      TEST_DB_NAME: sotrama_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev mariadb-client

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Create the test database and user
        run: |
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS sotrama_test;
            CREATE USER IF NOT EXISTS 'sotrama'@'%' IDENTIFIED BY 'password';
            GRANT ALL PRIVILEGES ON *.* TO 'sotrama'@'%';
            FLUSH PRIVILEGES;"

      - name: Verify MariaDB connectivity
        working-directory: rust-backend
        run: |
          mariadb \
            --host="$TEST_DB_HOST" \
            --port="$TEST_DB_PORT" \
            --user="$TEST_DB_USER" \
            --password="$TEST_DB_PASSWORD" \
            "$TEST_DB_NAME" \
            -e "SELECT 1"

      - name: Migration idempotency, backup, and patch recovery
        working-directory: rust-backend
        env:
          SOTRAMA_DB_HOST: ${{ env.TEST_DB_HOST }}
          SOTRAMA_DB_PORT: ${{ env.TEST_DB_PORT }}
          SOTRAMA_DB_USER: ${{ env.TEST_DB_USER }}
          SOTRAMA_DB_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          SOTRAMA_DB_NAME: ${{ env.TEST_DB_NAME }}
          SOTRAMA_COUNTRY_CODE: in
          SOTRAMA_BACKUP_DIR: ${{ runner.temp }}/sotrama-backups
        run: |
          cargo run --locked -- --migrate > first.json
          # A successful exit alone is insufficient: an empty report on a new
          # database could mean the migration skipped creating the schema.
          jq -e '
            (.tables_created | length) > 0 and
            (.indexes_created | length) > 0 and
            (.foreign_keys_created | length) > 0
          ' first.json || {
            echo "fresh migration did not create tables, indexes, and foreign keys"
            cat first.json
            exit 1
          }
          # Exercise an existing populated schema instead of testing only an empty database.
          docker exec -i "${{ job.services.mariadb.id }}" mariadb -uroot -proot sotrama_test <<'SQL'
          UPDATE singlevalue SET value='0.0.0' WHERE parent='SystemSettings' AND fieldname='version';
          DELETE FROM patchrun WHERE name='fixItemHSNField';
          INSERT INTO patchrun (name, failed, version, createdBy, modifiedBy, created, modified)
            VALUES ('migration-fixture', 0, '0.5.0-beta.0', '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
          ALTER TABLE patchrun ADD COLUMN legacyMigrationFixture VARCHAR(32) NULL;
          UPDATE patchrun SET legacyMigrationFixture = 'preserve-me' WHERE name = 'migration-fixture';
          ALTER TABLE item MODIFY COLUMN hsnCode VARCHAR(255) NULL;
          ALTER TABLE item ADD COLUMN legacyMigrationFixture VARCHAR(32) NULL;
          INSERT INTO account (name, rootType, lft, rgt, createdBy, modifiedBy, created, modified)
            VALUES ('CI Income', 'Income', 1, 2, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6)),
                   ('CI Expense', 'Expense', 3, 4, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
          INSERT INTO item (name, hsnCode, legacyMigrationFixture, incomeAccount, expenseAccount, unit, createdBy, modifiedBy, created, modified)
            VALUES ('legacy-item-fixture', 'HSN-LEGACY', 'preserve-me', 'CI Income', 'CI Expense', NULL, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
          UPDATE item SET trackItem = 0, barcode = '' WHERE name = 'legacy-item-fixture';
          # Simulate an older deployed schema that predates this nullable Link.
          # Removing its FK first keeps the fixture valid on every MariaDB line.
          ALTER TABLE item DROP FOREIGN KEY fk_Item_itemGroup;
          ALTER TABLE item DROP COLUMN itemGroup;
          SQL
          cargo run --locked -- --migrate > upgrade.json
          jq -e '
            (.errors | length) == 0 and
            any(.columns_added[]; ascii_downcase == "item.itemgroup") and
            any(.foreign_keys_created[]; ascii_downcase == "item.itemgroup")
          ' upgrade.json || {
            echo "historical schema upgrade did not restore the missing Link column and foreign key"
            cat upgrade.json
            exit 1
          }
          # The repaired historical schema must converge on the next run.
          cargo run --locked -- --migrate > second.json
          # A second run against the same schema must have no DDL left to apply.
          jq -e '
            (.tables_created   | length) == 0 and
            (.columns_added    | length) == 0 and
            (.columns_removed  | length) == 0 and
            (.columns_retyped  | length) == 0 and
            (.indexes_created  | length) == 0 and
            (.foreign_keys_created | length) == 0
          ' second.json || {
            echo "migration is not idempotent"
            cat first.json second.json
            exit 1
          }
          preserved=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT legacyMigrationFixture FROM patchrun WHERE name='migration-fixture'")
          test "$preserved" = "preserve-me"
          legacy_row=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT CONCAT(hsnCode, ':', legacyMigrationFixture) FROM item WHERE name='legacy-item-fixture'")
          test "$legacy_row" = "HSN-LEGACY:preserve-me"
          legacy_nullable_values=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT CONCAT(trackItem, ':', HEX(barcode), ':', IF(itemGroup IS NULL, 'NULL', itemGroup)) FROM item WHERE name='legacy-item-fixture'")
          test "$legacy_nullable_values" = "0::NULL"
          item_group_column=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='sotrama_test' AND table_name='item' AND column_name='itemGroup'")
          test "$item_group_column" = "1"
          item_group_fk=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM information_schema.key_column_usage WHERE constraint_schema='sotrama_test' AND table_name='item' AND column_name='itemGroup' AND referenced_table_name='itemgroup'")
          test "$item_group_fk" = "1"
          hsn_type=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT DATA_TYPE FROM information_schema.columns WHERE table_schema='sotrama_test' AND table_name='item' AND column_name='hsnCode'")
          test "$hsn_type" = "text"
          backup=$(find "${{ runner.temp }}/sotrama-backups" -maxdepth 1 -type f -name '*.sql' | head -n 1)
          test -n "$backup"
          test -s "$backup"
          cargo run --locked -- --restore-backup "$backup" --restore-to sotrama_restore_test
          restored=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_restore_test -e "SELECT CONCAT(hsnCode, ':', legacyMigrationFixture) FROM item WHERE name='legacy-item-fixture'")
          test "$restored" = "HSN-LEGACY:preserve-me"
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot -e "DROP DATABASE sotrama_restore_test"

          # Preserve a valid manifest for a deliberately broken dump so the
          # failure occurs during import and exercises staging-database cleanup.
          backup_manifest="${backup%.sql}.json"
          cp "$backup" restore-failure.sql
          printf '\nTHIS IS NOT VALID SQL;\n' >> restore-failure.sql
          broken_bytes=$(stat -c %s restore-failure.sql)
          broken_sha=$(sha256sum restore-failure.sql | cut -d ' ' -f 1)
          jq --arg filename "restore-failure.sql" --argjson bytes "$broken_bytes" --arg sha "$broken_sha" \
            '.fileName = $filename | .fileBytes = $bytes | .sha256 = $sha' \
            "$backup_manifest" > restore-failure.json
          if ./target/debug/sotrama-backend --restore-backup restore-failure.sql --restore-to sotrama_restore_failed; then
            echo "restore unexpectedly accepted a dump with invalid SQL"
            exit 1
          fi
          failed_restore_db=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='sotrama_restore_failed'")
          test "$failed_restore_db" = "0"
          rm -f restore-failure.sql restore-failure.json

          ./target/debug/sotrama-backend --migrate > concurrent-a.json &
          first_pid=$!
          ./target/debug/sotrama-backend --migrate > concurrent-b.json &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          jq -s -e 'length == 2 and all(.[]; .errors == [])' concurrent-a.json concurrent-b.json
          # A failed connection to a named database must not create an empty database.
          if SOTRAMA_DB_NAME=sotrama_must_not_be_created ./target/debug/sotrama-backend --serve --no-migrate </dev/null; then
            echo "connection to a missing database unexpectedly succeeded"
            exit 1
          fi
          missing=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='sotrama_must_not_be_created'")
          test "$missing" = "0"

          # Force one legacy pre-migration patch to fail, then verify a later
          # startup retries it after the database-side failure is removed.
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot sotrama_test -e "
            DROP TRIGGER IF EXISTS ci_fail_payment_reference_type;
            INSERT INTO party (name, role, createdBy, modifiedBy, created, modified)
              VALUES ('CI Party', 'Both', '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
            INSERT INTO numberseries (name, referenceType, current, createdBy, modifiedBy, created, modified)
              VALUES ('CI-PAY-', 'Payment', 1001, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
            INSERT INTO paymentmethod (name, type, createdBy, modifiedBy, created, modified)
              VALUES ('CI Cash', 'Cash', '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));
            INSERT INTO payment (name, numberSeries, party, date, paymentType, account, paymentAccount, paymentMethod, amount, referenceType, submitted, cancelled, createdBy, modifiedBy, created, modified)
              VALUES ('ci-patch-retry-payment', 'CI-PAY-', 'CI Party', NOW(6), 'Pay', 'CI Expense', 'CI Income', 'CI Cash', 0, NULL, 0, 0, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6))
              ON DUPLICATE KEY UPDATE paymentType = VALUES(paymentType), referenceType = NULL;
            UPDATE patchrun SET failed = 1 WHERE name = 'setPaymentReferenceType';
            CREATE TRIGGER ci_fail_payment_reference_type BEFORE UPDATE ON payment
              FOR EACH ROW SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'intentional CI patch failure';"
          if ./target/debug/sotrama-backend --migrate > patch-failure.json 2>&1; then
            echo "migration unexpectedly succeeded while the patch trigger was active"
            cat patch-failure.json
            exit 1
          fi
          failed_patch=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT failed FROM patchrun WHERE name='setPaymentReferenceType'")
          test "$failed_patch" = "1"
          failed_payment=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COALESCE(referenceType, 'NULL') FROM payment WHERE name='ci-patch-retry-payment'")
          test "$failed_payment" = "NULL"

          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot sotrama_test -e "DROP TRIGGER ci_fail_payment_reference_type"
          ./target/debug/sotrama-backend --migrate > patch-retry.json
          retried_patch=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT failed FROM patchrun WHERE name='setPaymentReferenceType'")
          test "$retried_patch" = "0"
          retried_payment=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT referenceType FROM payment WHERE name='ci-patch-retry-payment'")
          test "$retried_payment" = "PurchaseInvoice"

          echo "first run:"
          cat first.json

      - name: Exercise the JSON-RPC contract against MariaDB
        working-directory: rust-backend
        env:
          SOTRAMA_DB_HOST: ${{ env.TEST_DB_HOST }}
          SOTRAMA_DB_PORT: ${{ env.TEST_DB_PORT }}
          SOTRAMA_DB_USER: ${{ env.TEST_DB_USER }}
          SOTRAMA_DB_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          SOTRAMA_DB_NAME: ${{ env.TEST_DB_NAME }}
        run: |
          # Custom-field definitions are loaded at sidecar startup. Verify the
          # registry sees a field stored in the same MariaDB schema used by the
          # TypeScript backend, rather than silently dropping or ignoring it.
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot sotrama_test -e "
           INSERT INTO customfield
              (name, parent, parentSchemaName, parentFieldname, idx, label, fieldname, fieldtype, isRequired)
           VALUES
              ('ci-custom-field', 'Item', 'CustomField', 'customFields', 0, 'CI Custom Field', 'ciCustomField', 'Data', 0)
            ON DUPLICATE KEY UPDATE fieldname = VALUES(fieldname), fieldtype = VALUES(fieldtype);
            ALTER TABLE customfield DROP COLUMN \`references\`;"
          docker exec "${{ job.services.mariadb.id }}" mariadb -uroot -proot sotrama_test -e "
            DELETE FROM singlevalue WHERE parent='SystemSettings' AND fieldname IN ('ci-null-single-value', 'ci-empty-single-value');
            INSERT INTO singlevalue (name, parent, fieldname, value, createdBy, modifiedBy, created, modified)
              VALUES ('ci-null-single-value-key', 'SystemSettings', 'ci-null-single-value', NULL, '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6)),
                     ('ci-empty-single-value-key', 'SystemSettings', 'ci-empty-single-value', '', '__SYSTEM__', '__SYSTEM__', NOW(6), NOW(6));"
          missing_uom_count=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM uom WHERE name='ci-no-such-uom-rollback'")
          test "$missing_uom_count" = "0"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"db.connect","params":[]}' \
            '{"jsonrpc":"2.0","id":2,"method":"db.call","params":["count","Item",{}]}' \
            '{"jsonrpc":"2.0","id":3,"method":"db.call","params":["getSingleValues",{"fieldname":"countryCode","parent":"SystemSettings"}]}' \
            '{"jsonrpc":"2.0","id":4,"method":"db.call","params":["getNextSeriesValue","CI-SERIES-","Item"]}' \
            '{"jsonrpc":"2.0","id":5,"method":"db.call","params":["getNextSeriesValue","CI-SERIES-","Item"]}' \
            '{"jsonrpc":"2.0","id":6,"method":"db.schema","params":[]}' \
            '{"jsonrpc":"2.0","id":9,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","hsnCode":"HSN-LEGACY","trackItem":true}]}' \
            '{"jsonrpc":"2.0","id":12,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","uomConversions":[{"name":"ci-uom-child","uom":"Unit","conversionFactor":2}]}]}' \
            '{"jsonrpc":"2.0","id":13,"method":"db.call","params":["get","Item","legacy-item-fixture",["name","uomConversions"]]}' \
            '{"jsonrpc":"2.0","id":14,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","uomConversions":[{"name":"ci-uom-child","uom":"Unit","conversionFactor":3}]}]}' \
            '{"jsonrpc":"2.0","id":15,"method":"db.call","params":["get","Item","legacy-item-fixture",["name","uomConversions"]]}' \
            '{"jsonrpc":"2.0","id":16,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","uomConversions":[]}]}' \
            '{"jsonrpc":"2.0","id":17,"method":"db.call","params":["get","Item","legacy-item-fixture",["name","uomConversions"]]}' \
            '{"jsonrpc":"2.0","id":10,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","hsnCode":"MUST-ROLLBACK","uomConversions":[null]}]}' \
            '{"jsonrpc":"2.0","id":11,"method":"db.call","params":["get","Item","legacy-item-fixture",["hsnCode","trackItem"]]}' \
            '{"jsonrpc":"2.0","id":18,"method":"db.call","params":["getAll","Item",{"fields":["name","trackItem"],"filters":{"trackItem":true},"orderBy":["name"],"order":"asc","limit":10}]}' \
            '{"jsonrpc":"2.0","id":19,"method":"db.call","params":["exists","Item","legacy-item-fixture"]}' \
            '{"jsonrpc":"2.0","id":20,"method":"db.call","params":["exists","Item","ci-missing-item"]}' \
            '{"jsonrpc":"2.0","id":21,"method":"db.call","params":["count","Item",{"filters":{"trackItem":true}}]}' \
            '{"jsonrpc":"2.0","id":22,"method":"db.call","params":["insert","Defaults",{"saveButtonColour":"#123456","posCashDenominations":[{"name":"ci-default-cash-denomination","denomination":100}]}]}' \
            '{"jsonrpc":"2.0","id":23,"method":"db.call","params":["get","Defaults"]}' \
            '{"jsonrpc":"2.0","id":24,"method":"db.call","params":["update","Defaults",{"saveButtonColour":"#654321","posCashDenominations":[{"name":"ci-default-cash-denomination","denomination":200}]}]}' \
            '{"jsonrpc":"2.0","id":25,"method":"db.call","params":["get","Defaults"]}' \
            '{"jsonrpc":"2.0","id":26,"method":"db.call","params":["update","Defaults",{"posCashDenominations":[]}]}' \
            '{"jsonrpc":"2.0","id":27,"method":"db.call","params":["get","Defaults"]}' \
            '{"jsonrpc":"2.0","id":28,"method":"db.call","params":["update","Defaults",{"saveButtonColour":"#MUST-ROLLBACK","posCashDenominations":[null]}]}' \
            '{"jsonrpc":"2.0","id":29,"method":"db.call","params":["get","Defaults"]}' \
            '{"jsonrpc":"2.0","id":30,"method":"db.call","params":["update","Payment",{"name":"ci-patch-retry-payment","date":"2026-10-12 07:34:56.123","clearanceDate":null,"referenceId":"","amount":"12.50","writeoff":"0.00"}]}' \
            '{"jsonrpc":"2.0","id":31,"method":"db.call","params":["get","Payment","ci-patch-retry-payment",["date","clearanceDate","referenceId","amount","writeoff"]]}' \
            '{"jsonrpc":"2.0","id":32,"method":"db.call","params":["update","Payment",{"name":"ci-patch-retry-payment","amount":"13.00"}]}' \
            '{"jsonrpc":"2.0","id":33,"method":"db.call","params":["get","Payment","ci-patch-retry-payment",["date","clearanceDate","referenceId","amount","writeoff"]]}' \
            '{"jsonrpc":"2.0","id":36,"method":"db.call","params":["getSingleValues",{"fieldname":"ci-null-single-value","parent":"SystemSettings"},{"fieldname":"ci-empty-single-value","parent":"SystemSettings"}]}' \
            '{"jsonrpc":"2.0","id":37,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","definitelyNotAColumn":"must-not-be-ignored"}]}' \
            '{"jsonrpc":"2.0","id":39,"method":"db.call","params":["getAll","Payment",{"fields":["name"],"filters":{"clearanceDate":null}}]}' \
            '{"jsonrpc":"2.0","id":40,"method":"db.call","params":["update","Item",{"name":"legacy-item-fixture","hsnCode":"MUST-ROLLBACK-FK","uomConversions":[{"name":"ci-fk-rollback-child","uom":"ci-no-such-uom-rollback","conversionFactor":7}]}]}' \
            | cargo run --locked -- --serve --no-migrate > protocol.jsonl
          jq -s -e '
            length == 35 and
            .[0].jsonrpc == "2.0" and .[0].id == 1 and
            .[0].result.data.countryCode == "in" and
            .[1].jsonrpc == "2.0" and .[1].id == 2 and
            (.[1].result.data | type == "number") and
            .[2].jsonrpc == "2.0" and .[2].id == 3 and
            (.[2].result.data | length) == 1 and
            .[2].result.data[0].fieldname == "countryCode" and
            .[2].result.data[0].value == "in" and
            .[3].jsonrpc == "2.0" and .[3].id == 4 and
            .[3].result.data == 1 and
            .[4].jsonrpc == "2.0" and .[4].id == 5 and
            .[4].result.data == 2 and
            .[5].jsonrpc == "2.0" and .[5].id == 6 and
            (.[5].result.data.Item.fields | any(.fieldname == "ciCustomField" and .isCustom == true)) and
            .[6].jsonrpc == "2.0" and .[6].id == 9 and .[6].result.data == null and
            .[7].jsonrpc == "2.0" and .[7].id == 12 and .[7].result.data == null and
            .[8].jsonrpc == "2.0" and .[8].id == 13 and
            .[8].result.data.uomConversions[0].name == "ci-uom-child" and
            .[8].result.data.uomConversions[0].conversionFactor == 2 and
            .[9].jsonrpc == "2.0" and .[9].id == 14 and .[9].result.data == null and
            .[10].jsonrpc == "2.0" and .[10].id == 15 and
            .[10].result.data.uomConversions[0].conversionFactor == 3 and
            .[11].jsonrpc == "2.0" and .[11].id == 16 and .[11].result.data == null and
            .[12].jsonrpc == "2.0" and .[12].id == 17 and
            (.[12].result.data.uomConversions | length) == 0 and
            .[13].jsonrpc == "2.0" and .[13].id == 10 and
            (.[13].result.error.message | contains("must be an object")) and
            .[14].jsonrpc == "2.0" and .[14].id == 11 and
            .[14].result.data.hsnCode == "HSN-LEGACY" and
            .[14].result.data.trackItem == true and
            .[15].jsonrpc == "2.0" and .[15].id == 18 and
            (.[15].result.data | any(.name == "legacy-item-fixture" and .trackItem == true)) and
            .[16].jsonrpc == "2.0" and .[16].id == 19 and .[16].result.data == true and
            .[17].jsonrpc == "2.0" and .[17].id == 20 and .[17].result.data == false and
            .[18].jsonrpc == "2.0" and .[18].id == 21 and .[18].result.data >= 1 and
            .[19].jsonrpc == "2.0" and .[19].id == 22 and
            .[19].result.data.posCashDenominations[0].denomination == "100" and
            .[20].jsonrpc == "2.0" and .[20].id == 23 and
            .[20].result.data.saveButtonColour == "#123456" and
            .[20].result.data.posCashDenominations[0].denomination == "100" and
            .[21].jsonrpc == "2.0" and .[21].id == 24 and .[21].result.data == null and
            .[22].jsonrpc == "2.0" and .[22].id == 25 and
            .[22].result.data.saveButtonColour == "#654321" and
            .[22].result.data.posCashDenominations[0].denomination == "200" and
            .[23].jsonrpc == "2.0" and .[23].id == 26 and .[23].result.data == null and
            .[24].jsonrpc == "2.0" and .[24].id == 27 and
            (.[24].result.data.posCashDenominations | length) == 0 and
            .[24].result.data.saveButtonColour == "#654321" and
            .[25].jsonrpc == "2.0" and .[25].id == 28 and
            (.[25].result.error.message | contains("must be an object")) and
            .[26].jsonrpc == "2.0" and .[26].id == 29 and
            .[26].result.data.saveButtonColour == "#654321" and
            (.[26].result.data.posCashDenominations | length) == 0 and
            .[27].jsonrpc == "2.0" and .[27].id == 30 and .[27].result.data == null and
            .[28].jsonrpc == "2.0" and .[28].id == 31 and
            .[28].result.data.date == "2026-10-12 07:34:56.123" and
            .[28].result.data.clearanceDate == null and
            .[28].result.data.referenceId == "" and
            .[28].result.data.amount == "12.50" and
            .[28].result.data.writeoff == "0.00" and
            .[29].jsonrpc == "2.0" and .[29].id == 32 and .[29].result.data == null and
            .[30].jsonrpc == "2.0" and .[30].id == 33 and
            .[30].result.data.date == "2026-10-12 07:34:56.123" and
            .[30].result.data.clearanceDate == null and
            .[30].result.data.referenceId == "" and
            .[30].result.data.amount == "13.00" and
            .[30].result.data.writeoff == "0.00" and
            .[31].jsonrpc == "2.0" and .[31].id == 36 and
            any(.[31].result.data[]; .fieldname == "ci-null-single-value" and .value == null) and
            any(.[31].result.data[]; .fieldname == "ci-empty-single-value" and .value == "") and
            .[32].jsonrpc == "2.0" and .[32].id == 37 and
            .[32].result.error.name == "DatabaseError" and
            .[32].result.error.errno == 1054 and
            (.[32].result.error.message | ascii_downcase | contains("unknown column")) and
            .[33].jsonrpc == "2.0" and .[33].id == 39 and
            (.[33].result.data | any(.name == "ci-patch-retry-payment")) and
            .[34].jsonrpc == "2.0" and .[34].id == 40 and
            .[34].result.error.name == "ForeignKeyError" and
            .[34].result.error.errno == 1452
          ' protocol.jsonl

          single_value_state=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT CONCAT(SUM(fieldname='ci-null-single-value' AND value IS NULL), ':', SUM(fieldname='ci-empty-single-value' AND value='')) FROM singlevalue WHERE parent='SystemSettings' AND fieldname IN ('ci-null-single-value', 'ci-empty-single-value')")
          test "$single_value_state" = "1:1"

          # Distinguish SQL NULL, an empty string, and zero-valued currency text
          # in storage; the subsequent partial update must preserve omitted fields.
          payment_values=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT CONCAT(DATE_FORMAT(date, '%Y-%m-%d %H:%i:%s.%f'), ':', IF(clearanceDate IS NULL, 'NULL', DATE_FORMAT(clearanceDate, '%Y-%m-%d')), ':', IF(referenceId IS NULL, 'NULL', CONCAT('HEX=', HEX(referenceId))), ':', COALESCE(writeoff, 'SQLNULL'), ':', amount) FROM payment WHERE name='ci-patch-retry-payment'")
          test "$payment_values" = "2026-10-12 07:34:56.123000:NULL:HEX=:0.00:13.00"

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":34,"method":"db.call","params":["delete","Payment","ci-patch-retry-payment"]}' \
            '{"jsonrpc":"2.0","id":35,"method":"db.call","params":["exists","Payment","ci-patch-retry-payment"]}' \
            | ./target/debug/sotrama-backend --serve --no-migrate > delete.jsonl
          jq -s -e '
            length == 2 and
            .[0].jsonrpc == "2.0" and .[0].id == 34 and .[0].result.data == null and
            .[1].jsonrpc == "2.0" and .[1].id == 35 and .[1].result.data == false
          ' delete.jsonl

          # Exercise the bounded reader through the real JSON-RPC process:
          # reject an oversized line, drain it, and still serve the next request.
          {
            head -c 8388609 /dev/zero | tr '\000' 'x'
            printf '\n%s\n' '{"jsonrpc":"2.0","id":38,"method":"db.connect","params":[]}'
          } | ./target/debug/sotrama-backend --serve --no-migrate > oversized.jsonl
          jq -s -e '
            length == 2 and
            .[0].jsonrpc == "2.0" and .[0].id == null and
            .[0].result.error.name == "ValueError" and
            (.[0].result.error.message | contains("8388608-byte limit")) and
            .[1].jsonrpc == "2.0" and .[1].id == 38 and
            .[1].result.data.countryCode == "in"
          ' oversized.jsonl

          deleted_payment_count=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM payment WHERE name='ci-patch-retry-payment'")
          test "$deleted_payment_count" = "0"

          # Confirm the failed transaction left the original values in MariaDB,
          # independently of the sidecar's error envelope and subsequent read.
          rollback_state=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT CONCAT(hsnCode, ':', trackItem) FROM item WHERE name='legacy-item-fixture'")
          test "$rollback_state" = "HSN-LEGACY:1"

          child_rows=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM uomconversionitem WHERE parent='legacy-item-fixture'")
          test "$child_rows" = "0"
          parent_hsn=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT hsnCode FROM item WHERE name='legacy-item-fixture'")
          test "$parent_hsn" = "HSN-LEGACY"

          # Single-document child rows are stored in their own table, never as
          # a JSON/text blob in singlevalue, and updates must reconcile in place.
          single_child_scalar=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM singlevalue WHERE parent='Defaults' AND fieldname='posCashDenominations'")
          test "$single_child_scalar" = "0"
          single_child_rows=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT COUNT(*) FROM defaultcashdenominations WHERE parent='Defaults'")
          test "$single_child_rows" = "0"
          single_scalar_after_child_failure=$(docker exec "${{ job.services.mariadb.id }}" mariadb -N -uroot -proot sotrama_test -e "SELECT value FROM singlevalue WHERE parent='Defaults' AND fieldname='saveButtonColour'")
          test "$single_scalar_after_child_failure" = "#654321"

          # Start two independent sidecars against a series that does not yet
          # exist. This exercises the first-row race as well as row locking.
          printf '%s\n' '{"jsonrpc":"2.0","id":7,"method":"db.call","params":["getNextSeriesValue","CI-RACE-","Item"]}' \
            | ./target/debug/sotrama-backend --serve --no-migrate > series-a.jsonl &
          first_pid=$!
          printf '%s\n' '{"jsonrpc":"2.0","id":8,"method":"db.call","params":["getNextSeriesValue","CI-RACE-","Item"]}' \
            | ./target/debug/sotrama-backend --serve --no-migrate > series-b.jsonl &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"
          jq -s -e '
            length == 2 and
            .[0].result.data != .[1].result.data and
            ([.[].result.data] | sort) == [1, 2]
          ' series-a.jsonl series-b.jsonl

      - name: Verify production TypeScript client against the Rust sidecar
        env:
          SOTRAMA_BACKEND_PATH: ${{ github.workspace }}/rust-backend/target/debug/sotrama-backend
          SOTRAMA_DB_HOST: ${{ env.TEST_DB_HOST }}
          SOTRAMA_DB_PORT: ${{ env.TEST_DB_PORT }}
          SOTRAMA_DB_USER: ${{ env.TEST_DB_USER }}
          SOTRAMA_DB_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          SOTRAMA_DB_NAME: ${{ env.TEST_DB_NAME }}
          SOTRAMA_BACKUP_DIR: ${{ runner.temp }}/sotrama-backups
        run: node --experimental-strip-types scripts/verify-rust-backend-client-runtime.mjs success

  build:
    name: build (${{ matrix.os }})
    needs: [check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sotrama-backend-linux-x64
            binary: sotrama-backend
          - os: windows-latest
            artifact: sotrama-backend-windows-x64
            binary: sotrama-backend.exe
          - os: macos-latest
            artifact: sotrama-backend-macos-arm64
            binary: sotrama-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Build release binary
        working-directory: rust-backend
        run: cargo build --locked --release

      - name: Smoke test native binary startup
        working-directory: rust-backend
        run: cargo run --locked --release -- --help

      - name: Verify application client propagates database startup failures
        env:
          SOTRAMA_BACKEND_PATH: ${{ github.workspace }}/rust-backend/target/release/${{ matrix.binary }}
          SOTRAMA_DB_PASSWORD: runtime-smoke-secret
        run: node --experimental-strip-types scripts/verify-rust-backend-client-runtime.mjs failure

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust-backend/target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
