[package]
name = "sotrama-backend"
version = "0.1.0"
edition = "2021"
description = "Sotrama Suite Rust Backend - MariaDB data layer, migrations, JSON-RPC sidecar"
license = "AGPL-3.0-only"
publish = false

[workspace]
resolver = "2"

[dependencies]
# Async runtime. Explicit features, not "full": each unused crate costs CI compile time.
tokio = { version = "1.39", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "fs",
  "process",
  "signal",
  "sync",
  "time",
] }

# No macros feature: query! needs a live DB at compile time, which CI cannot provide.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "mysql",
  "chrono",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

clap = { version = "4.5", features = ["derive", "env"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1.0"
thiserror = "1.0"

chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

# Embeds tracked schemas/ so the sidecar ships no external files and cannot drift.
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[dev-dependencies]
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
